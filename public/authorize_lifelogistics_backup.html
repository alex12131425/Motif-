<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorize • Life Logistics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lz: {
                            green: '#96F550', // The neon green from your logo
                            dark: '#0a0a0b',
                            zinc: '#18181b'
                        }
                    },
                    fontFamily: {
                        sans: [
                            '-apple-system', 
                            'BlinkMacSystemFont', 
                            '"SF Pro Text"',
                            '"Segoe UI"', 
                            'Roboto', 
                            'sans-serif'
                        ],
                    }
                }
            }
        }
    </script>
    <style>
        /* Apple-esque subtle input auto-fill overriding */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #fafafa inset !important;
            border-radius: 0.75rem;
        }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // 🔥 IMPORTANT: REPLACE THIS WITH YOUR OWN FIREBASE CONFIG!
        // Because you are hosting on Render, the AI Studio default Firebase will block the login.
        // Go to console.firebase.google.com -> Create Project -> Enable Auth -> Get Web Config.
        const firebaseConfig = {
            apiKey: "AIzaSyAa_sn28F6iMOIej17qVLrnP87_McebFHs",
            authDomain: "lifeskillzs.firebaseapp.com",
            projectId: "lifeskillzs",
            storageBucket: "lifeskillzs.firebasestorage.app",
            messagingSenderId: "636631359646",
            appId: "1:636631359646:web:3ad231ad903ee4f8385b8f",
            measurementId: "G-7H1JC4YS0Y"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.handleGoogleSignIn = async function() {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                console.log("Logged in as:", user.email);
                
                // Get URL params to see if ChatGPT passed a redirect_uri
                const urlParams = new URLSearchParams(window.location.search);
                const redirectUri = urlParams.get('redirect_uri');
                const state = urlParams.get('state');

                if (redirectUri && state) {
                    const token = user.uid;
                    window.location.href = `${redirectUri}?code=${token}&state=${state}`;
                } else {
                    showSuccess(user.email);
                }
            } catch (error) {
                console.error("Error signing in with Google", error);
                alert("Authentication failed: " + error.message);
            }
        };

        window.handleEmailSignIn = async function(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const isSignUp = window.currentAuthMode === 'signup';

            try {
                let result;
                if (isSignUp) {
                    result = await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    result = await signInWithEmailAndPassword(auth, email, password);
                }
                const user = result.user;
                
                const urlParams = new URLSearchParams(window.location.search);
                const redirectUri = urlParams.get('redirect_uri');
                const state = urlParams.get('state');

                if (redirectUri && state) {
                    const token = user.uid;
                    window.location.href = `${redirectUri}?code=${token}&state=${state}`;
                } else {
                    showSuccess(user.email);
                }
            } catch (error) {
                console.error("Error signing in with email", error);
                alert((isSignUp ? "Sign up" : "Sign in") + " failed: " + error.message);
            }
        };

        function showSuccess(email) {
            document.body.innerHTML = `
                <div class="min-h-screen flex items-center justify-center bg-white">
                    <div class="text-center">
                        <div class="w-16 h-16 bg-lz-green rounded-full flex items-center justify-center mx-auto mb-6">
                            <svg class="w-8 h-8 text-lz-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <h2 class="text-2xl font-bold mb-2">Authentication Successful</h2>
                        <p class="text-zinc-500 mb-6">You are signed in as ${email}</p>
                        <p class="text-zinc-400 text-sm">You can now close this window and return to ChatGPT.</p>
                    </div>
                </div>
            `;
        }

        window.toggleAuthMode = function(e) {
            e.preventDefault();
            const mode = window.currentAuthMode || 'login';
            const titleEl = document.getElementById('auth-title');
            const toggleTextEl = document.getElementById('auth-toggle-text');
            const toggleLinkEl = document.getElementById('auth-toggle-link');
            const btnEl = document.getElementById('auth-submit-btn');

            if (mode === 'login') {
                window.currentAuthMode = 'signup';
                titleEl.textContent = 'Create an account.';
                toggleTextEl.textContent = 'Already have an account? ';
                toggleLinkEl.textContent = 'Sign in';
                btnEl.textContent = 'Sign Up';
            } else {
                window.currentAuthMode = 'login';
                titleEl.textContent = 'Welcome back.';
                toggleTextEl.textContent = 'New to Life Logistics? ';
                toggleLinkEl.textContent = 'Sign up';
                btnEl.textContent = 'Authorize Plugin';
            }
        };
        window.currentAuthMode = 'login';
    </script>
</head>
<body class="bg-white text-zinc-900 antialiased selection:bg-lz-green selection:text-lz-dark">

    <div class="min-h-screen flex w-full overflow-hidden">
        
        <!-- Left Side: Brand Identity (Hidden on Mobile) -->
        <div class="hidden lg:flex lg:w-1/2 bg-lz-dark relative flex-col justify-between p-14 border-r border-zinc-800/50">
            
            <!-- Liquid Glass Glowing Orb Background -->
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-lz-green/20 rounded-full blur-[140px] pointer-events-none"></div>
            
            <!-- Top Branding -->
            <div class="relative z-10 flex items-center gap-3">
                <img src="/logo.png" alt="Life Logistics" class="w-12 h-12 object-contain" onerror="this.src='https://placehold.co/100x100/96F550/0a0a0b?text=LZ'" />
                <span class="text-white text-2xl font-bold tracking-tight">Life Logistics</span>
            </div>

            <!-- Main Copy -->
            <div class="relative z-10 mb-10">
                <h1 class="text-[3.5rem] leading-[1.1] font-bold text-white tracking-tight mb-6">
                    Master your <br>practical life.
                </h1>
                <p class="text-zinc-400 text-xl max-w-md font-medium leading-relaxed">
                    Connect your devices, warranties, and subscriptions into one unified command center for ChatGPT.
                </p>
            </div>
            
            <!-- Bottom Legal/Links -->
            <div class="relative z-10">
                <p class="text-zinc-500 text-sm font-medium hover:text-white transition-colors cursor-pointer w-max">
                    Why Life Logistics?
                </p>
            </div>
        </div>

        <!-- Right Side: Auth Form -->
        <div class="w-full lg:w-1/2 flex items-center justify-center bg-white p-6 sm:p-12 relative">
            
            <!-- Subtle noise overlay for texture (optional) -->
            <div class="absolute inset-0 opacity-[0.015] pointer-events-none" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>

            <div class="w-full max-w-[420px] relative z-10">
                
                <!-- Mobile Logo -->
                <div class="lg:hidden flex items-center gap-2 mb-10">
                    <img src="/logo.png" alt="Life Logistics" class="w-8 h-8 object-contain" onerror="this.src='https://placehold.co/100x100/96F550/0a0a0b?text=LZ'" />
                    <span class="text-lz-dark text-xl font-bold tracking-tight">Life Logistics</span>
                </div>

                <div class="mb-10">
                    <h2 id="auth-title" class="text-[2rem] font-bold tracking-tight text-zinc-900 mb-2">Welcome back.</h2>
                    <p class="text-zinc-500 text-[15px]">
                        <span id="auth-toggle-text">New to Life Logistics? </span>
                        <a href="#" id="auth-toggle-link" onclick="toggleAuthMode(event)" class="text-zinc-900 font-semibold underline underline-offset-4 hover:text-lz-green transition-colors decoration-zinc-300 hover:decoration-lz-green">Sign up</a>
                    </p>
                </div>

                <form class="space-y-5" onsubmit="handleEmailSignIn(event)">
                    <!-- Email Input -->
                    <div>
                        <label class="block text-sm font-semibold text-zinc-700 mb-2">Your email address</label>
                        <input 
                            id="email"
                            type="email" 
                            class="w-full px-4 py-3.5 rounded-xl border border-zinc-200 bg-zinc-50/50 text-zinc-900 placeholder:text-zinc-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-lz-green focus:border-transparent transition-all shadow-sm" 
                            placeholder="name@example.com"
                            required
                        >
                    </div>
                    
                    <!-- Password Input -->
                    <div>
                        <label class="block text-sm font-semibold text-zinc-700 mb-2">Your password</label>
                        <div class="relative">
                            <input 
                                id="password"
                                type="password" 
                                class="w-full px-4 py-3.5 rounded-xl border border-zinc-200 bg-zinc-50/50 text-zinc-900 placeholder:text-zinc-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-lz-green focus:border-transparent transition-all shadow-sm" 
                                placeholder="••••••••"
                                required
                            >
                            <!-- Eye icon -->
                            <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-zinc-600">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Meta form row -->
                    <div class="flex items-center justify-between pt-1 pb-2">
                        <label class="flex items-center gap-2.5 cursor-pointer group">
                            <div class="relative flex items-center justify-center">
                                <input type="checkbox" class="peer appearance-none w-4.5 h-4.5 rounded border border-zinc-300 checked:bg-lz-dark checked:border-lz-dark focus:ring-2 focus:ring-lz-green focus:ring-offset-1 transition-all cursor-pointer">
                                <svg class="absolute w-3 h-3 text-white pointer-events-none opacity-0 peer-checked:opacity-100" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            </div>
                            <span class="text-[14px] text-zinc-600 font-medium group-hover:text-zinc-900 transition-colors">Remember me</span>
                        </label>
                        <a href="#" class="text-[14px] font-semibold underline underline-offset-4 text-zinc-600 hover:text-zinc-900 decoration-zinc-300 hover:decoration-zinc-900 transition-all">Trouble logging in?</a>
                    </div>

                    <!-- Primary Action -->
                    <button type="submit" id="auth-submit-btn" class="w-full py-4 px-4 bg-lz-green hover:bg-[#86ea42] text-lz-dark text-[15px] font-bold rounded-xl transition-all shadow-[0_4px_24px_rgba(150,245,80,0.25)] hover:shadow-[0_4px_32px_rgba(150,245,80,0.4)] hover:-translate-y-0.5 active:translate-y-0 active:shadow-none">
                        Authorize Plugin
                    </button>
                </form>

                <!-- Divider -->
                <div class="relative my-10">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-zinc-100"></div></div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-white text-zinc-400 font-medium text-[13px] uppercase tracking-wider">Or continue with</span>
                    </div>
                </div>

                <!-- SSO Options -->
                <div class="grid grid-cols-1 gap-3">
                    <button type="button" onclick="handleGoogleSignIn()" class="flex items-center justify-center gap-3 py-3 px-4 rounded-xl border border-zinc-200 bg-white hover:bg-zinc-50 hover:border-zinc-300 transition-all shadow-sm">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                        <span class="text-[14px] font-semibold text-zinc-700">Continue with Google</span>
                    </button>
                </div>
                
            </div>
        </div>
    </div>
</body>
</html>
